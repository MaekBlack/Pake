name: Build DataEase Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: tw93/Pake@main
        with:
          url: "http://10.1.12.2:9080"
          name: "DataEase"
          icon: "https://dataease-1323865188.cos.ap-nanjing.myqcloud.com/tmp/DataEase.ico"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DataEase-windows
          path: |
            *.msi
            *.exe
